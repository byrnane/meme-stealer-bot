name: meme-stealer-bot

services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      DATABASE_PATH: ${DATABASE_PATH:-data/bot.sqlite3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
