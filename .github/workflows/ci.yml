name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Format
        run: |
          . .venv/bin/activate
          ruff format --check .
