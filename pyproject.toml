[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meme-stealer-bot"
version = "0.2.0"
description = "A personal Telegram bot for publishing clean meme reposts to a channel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.27.0",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
meme-stealer-bot = "meme_stealer_bot.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/meme_stealer_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
